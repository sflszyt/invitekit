<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>婚礼回复 · 新人管理</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin.css"><link rel="icon" href="/favicon.svg"><script type="module" src="/admin.js"></script></head><body><a class="skip-link" href="#admin-main">跳至管理内容</a><header class="site-header"><a class="monogram" href="/">IK</a><span class="small-caps">PRIVATE WEDDING DESK</span><a href="/">返回请柬</a></header><main id="admin-main" class="admin-main"><p class="small-caps">INVITEKIT</p><div class="admin-heading"><h1>赴约回复</h1><div><button id="refresh" class="text-button">刷新回复</button><a id="export" href="/api/admin/export" class="primary-button" hidden>导出宾客名单</a></div></div><p id="admin-status" class="connection-status" role="status">正在验证管理权限…</p><section id="admin-data" hidden><div class="admin-metrics" aria-label="出席人数汇总"><div><span>成人</span><strong id="adults-total">0</strong></div><div><span>儿童</span><strong id="children-total">0</strong></div><div><span>出席总人数</span><strong id="guests-total">0</strong></div><div><span>已回复邀请</span><strong id="replies-total">0</strong></div></div><p class="admin-note" id="reply-summary"></p><p class="admin-note">出席总人数 = 成人 + 儿童，包含每份回复的填写人。缺席回复不计入出席人数；不收集儿童姓名或年龄。</p><div class="table-wrap"><table><caption class="visually-hidden">宾客回复记录</caption><thead><tr><th scope="col">姓名</th><th scope="col">赴约</th><th scope="col">成人</th><th scope="col">儿童</th><th scope="col">合计</th><th scope="col">更新于（UTC+8）</th></tr></thead><tbody id="replies-body"></tbody></table></div><p id="empty-state" class="empty-state" hidden>还没有收到回复。</p></section></main><footer><span>仅供新人管理婚礼安排</span><a href="/">InviteKit</a></footer></body></html>
